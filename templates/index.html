```html
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Number System Calculator</title>

    <link rel="icon"
          type="image/png"
          href="{{ url_for('static', filename='favicon.png') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="scene">

        <div class="calculator">

            <h1>NUMBER SYSTEM CALCULATOR</h1>

            <p class="description">
                Convert numbers from Base 2 to Base 16
            </p>


            <form method="POST">

                <label for="number">
                    Enter Number:
                </label>

                <input
                    id="number"
                    type="text"
                    name="number"
                    placeholder="Example: 101101"
                    required
                >


                <label for="from_base">
                    From Base:
                </label>

                <select id="from_base" name="from_base">

                    {% for base in range(2, 17) %}

                        <option value="{{ base }}">
                            Base {{ base }}
                        </option>

                    {% endfor %}

                </select>


                <label for="to_base">
                    To Base:
                </label>

                <select id="to_base" name="to_base">

                    {% for base in range(2, 17) %}

                        <option value="{{ base }}">
                            Base {{ base }}
                        </option>

                    {% endfor %}

                </select>


                <button type="submit">
                    CONVERT
                </button>

            </form>


            {% if result %}

                <div class="result">

                    <h2>RESULT</h2>

                    <div class="answer">
                        {{ result }}
                    </div>

                </div>


                <div class="solution">

                    <h3>SOLUTION</h3>

                    {{ solution | safe }}

                </div>

            {% endif %}

        </div>

    </div>

</body>

</html>
```
